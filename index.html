<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>校园失物招领</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <h1 class="logo">🔍 校园失物招领</h1>
      <button id="btnShowForm" class="btn btn-primary">+ 发布信息</button>
    </div>
  </header>

  <main class="container">

    <!-- 搜索 + 筛选栏 -->
    <section class="toolbar">
      <div class="search-box">
        <input type="text" id="inputKeyword" placeholder="搜索物品名称、描述、地点..." />
        <button id="btnSearch" class="btn btn-search">搜索</button>
      </div>
      <div class="filter-row">
        <select id="filterType">
          <option value="">全部类型</option>
          <option value="lost">寻物</option>
          <option value="found">招领</option>
        </select>
        <select id="filterCategory">
          <option value="">全部类别</option>
        </select>
        <select id="filterStatus">
          <option value="">全部状态</option>
          <option value="active">进行中</option>
          <option value="resolved">已结束</option>
        </select>
        <button id="btnMyItems" class="btn btn-outline">我的发布</button>
        <button id="btnReset" class="btn btn-outline">重置</button>
      </div>
      <div id="filterHint" class="filter-hint hidden"></div>
    </section>

    <!-- 发布表单（默认隐藏） -->
    <section class="panel hidden" id="publishPanel">
      <h2>发布信息</h2>
      <form id="publishForm" novalidate>
        <div class="form-row">
          <label>信息类型 *</label>
          <div class="radio-group">
            <label><input type="radio" name="type" value="lost" checked /> 寻物</label>
            <label><input type="radio" name="type" value="found" /> 招领</label>
          </div>
        </div>
        <div class="form-row">
          <label>物品名称 *</label>
          <input type="text" name="title" placeholder="如：校园卡、黑色雨伞" />
        </div>
        <div class="form-row">
          <label>物品类别</label>
          <select name="category">
            <option value="证件">证件</option>
            <option value="电子产品">电子产品</option>
            <option value="书籍">书籍</option>
            <option value="衣物">衣物</option>
            <option value="钥匙">钥匙</option>
            <option value="其他" selected>其他</option>
          </select>
        </div>
        <div class="form-row">
          <label>地点 *</label>
          <input type="text" name="location" placeholder="如：一食堂、图书馆三楼" />
        </div>
        <div class="form-row">
          <label>日期</label>
          <input type="date" name="eventDate" />
        </div>
        <div class="form-row">
          <label>发布者昵称 *</label>
          <input type="text" name="publisher" placeholder="你的昵称" />
        </div>
        <div class="form-row">
          <label>联系方式 *</label>
          <input type="text" name="contact" placeholder="微信号 / 手机号 / QQ" />
        </div>
        <div class="form-row">
          <label>补充描述</label>
          <textarea name="description" rows="3" placeholder="颜色、特征、其他说明..."></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">发布</button>
          <button type="button" id="btnCancelForm" class="btn btn-outline">取消</button>
        </div>
      </form>
    </section>

    <!-- 卡片列表 -->
    <section class="list" id="itemList"></section>

  </main>

  <!-- 详情弹窗 -->
  <div class="modal hidden" id="detailModal">
    <div class="modal-mask" data-close></div>
    <div class="modal-content">
      <button class="modal-close" data-close>&times;</button>
      <div id="detailBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast hidden" id="toast"></div>

  <script src="js/storage.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/search.js"></script>
  <script src="js/status.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
